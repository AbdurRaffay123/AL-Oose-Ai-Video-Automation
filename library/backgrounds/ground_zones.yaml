# GROUNDING RULE (owner, repeated 5+ times, 2026-10-06): every standing character's feet must sit on the flat
# walkable ground of its background. Never on rims, ledges, edges, leaves or dark areas.
#
# Per background plate (names as in library/backgrounds.yaml):
#   ground:    polygons where soles may stand (flat, walkable, lit like the rest of the ground)
#   forbidden: polygons that soles may never touch (stump rims and faces, roots, ladders, rocks, leaves, edges)
#   note:      what the zones mean
# Coordinates are FRACTIONS of the plate's source image (x right, y down), so they hold for any 9:16 crop or zoom.
# `ground: []` = no walkable ground: only characters the script tags as airborne (pos:.../air) may appear.
# Pre-flight (`grounding` check) FAILs any keyframe whose soles break these zones; `bbtb grounds` draws overlays.

