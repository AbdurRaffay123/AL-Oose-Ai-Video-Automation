# OFFICIAL character descriptions, written from Jason's sheets (Character-Facials-sheet, 2026-10-05: 01 Turnaround,
# 02 Head Expressions, 03 Scroll, 04 Landing, Saul Character Bible). Use in a template as {identity_bad_billy} /
# {identity_young_saul}. With header `elements: on` Kling also SEES the sheets (library/scene_references/).
official_identity:
  bad_billy: >-
    Bad Billy: a cartoon bird villain with a yellow feathered body; wild dark-brown head feathers with orange
    eyebrow feathers; a tall black top hat with one lightning-bolt crack near the top that never overlaps the
    badge, and a round silver badge with a white rim and a red script letter B; a round monocle with a thin
    black frame and a thin chain on his LEFT eye only; a long orange beak with NO teeth inside when it opens;
    teal curly moustache whiskers with the same spiral shape on both sides; a dark red vest, a brown belt with a
    gold square buckle and red-and-black striped shorts; teal-and-red high-top sneakers with a white star and
    pink-white soles; three long yellow tail feathers. His wings act as his arms: each wing ends in five long
    yellow primary feathers, never human hands or fingers, never fists.
  young_saul: >-
    Young Saul the Worm: a smooth light-pink worm body with darker plum segmentation rings on the lower body;
    TWO ENORMOUS ROUND EYES that take up most of his head - pale blue-white with small black pupils and white
    highlights, much larger than any other feature; a round, plump head, never flat; small brown curved eyebrows
    above each eye; a wide friendly mouth with two little buck teeth; white cartoon gloves with four fingers on
    both hands; NO legs, NO feet, NO shoes; the worm body tapers at the bottom. CRITICAL: his eyes stay LARGE
    and ROUND in every single frame - they never shrink, narrow or flatten, and his head never flattens.
  young_saul_v1: >-
    Young Saul: a small light-pink cartoon worm with no legs and no feet, dark plum rings near his tail, huge
    round pale-blue eyes with black pupils and white highlights, small brown eyebrows, two little buck teeth
    when he smiles, and white cartoon gloves on his tiny hands (always white). Happy, curious, playful and
    loyal.
