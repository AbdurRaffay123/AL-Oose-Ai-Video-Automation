# Kling prompt templates. Explained (and quoted verbatim) in docs/kling_prompts.md.
# Changing any template changes the approval code of every shot that uses it.
#
# Placeholders, filled per shot by the pipeline:
#   {facing}    from the art's facing in the character file ("facing right" / "facing left" / "facing the camera")
#   {line}      the exact script line (Kling 3.0 speaks it, then ElevenLabs re-voices it as the character)
#   {acting}    the script's acting tags for the line (e.g. "skeptical")
#   {direction} where an entrance comes from, from the script's enter-left / enter-right tag
# A script line picks a template with the tag `prompt:<name>`; talking lines default to talk_<character>,
# action lines to `action`.

facing_words: {right: facing right, left: facing left, front: facing the camera}
direction_words: {enter-right: from the right, enter-left: from the left}

# v3 - Kling 3.0 (owner's natural-motion prompts, 2026-10-04: talk_bad_billy, billy_walk, big_guy_erupt). Talking: fal-ai/kling-video/v3/turbo/standard/image-to-video
# (native audio always on; no negative prompt or end frame on Turbo). Action: fal-ai/kling-video/v3/standard/
# image-to-video, silent, start + end frame, with the negative prompt below.
