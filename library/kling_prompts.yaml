  talk_bad_billy: >-
    Cartoon bird villain, orange beak, black top hat, monocle on left eye, {facing}, standing on rocky ground.
    A cocky, theatrical show-off: every line is a performance. He is {acting} and says: "{line}" Beak opens
    WIDE and snaps shut with each word. He throws his whole body into the line: leans far forward on the
    taunts, rocks back on his heels for effect, head tilting and bobbing with the rhythm of the words. Wings
    flare out wide for emphasis, then fold back. Feet shift and stomp on the ground, never floating. Big,
    bold villain personality, never casual. Wings stay as feathered bird wings at all times, no human hands,
    no fingers, no arms. Static camera. Consistent 2D cartoon style. No smearing.
  # Test only (owner 2026-10-04): the most expressive version. Kling 3.0 Turbo or Wan 2.7 (tag prompt:talk_bad_billy_max_energy).
  talk_bad_billy_max_energy: >-
    2D cartoon animation in exactly the same art style and colours as the input image. Cartoon bird villain,
    orange beak, black top hat with a "B" badge, monocle on his LEFT eye, {facing}, on the ground. MAXIMUM
    energy: he is {acting} and delivers his line like a scene-stealing stage villain: "{line}" His beak flies
    WIDE open and snaps shut on every word. Big full-body motion from the first frame to the last: he lunges
    far forward with his neck stretched out, then whips back upright; his head jabs, tilts and bobs to the
    rhythm of the words; both wings sweep out wide like a showman's cape and snap back to his sides; he stomps
