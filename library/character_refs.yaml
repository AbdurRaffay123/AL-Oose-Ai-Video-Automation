# Reusable character reference sets (owner 2026-10-06) -> library/scene_references/<char>/ (`bbtb references --characters`).
# Saul: his EYES are his defining feature, so ref 1 is ONE large face close-up (eyes at their true size), then the
# expression faces, then body poses. Billy: ref 1 is head close-ups (chin + moustache curls), then angles, details.
saul:
  char: young_saul
  frontal: saul_standing_tall
  refs: [[saul_face_happy], [saul_face_excited, saul_face_surprised, saul_face_worried, saul_face_scared], [saul_ball, saul_cheerful, saul_idle_lookup]]
billy:
  char: bad_billy
  frontal: billy_tophat_34left
  refs: [[billy_head_neutral, billy_head_suspicious], [billy_turn_34left, billy_turn_front], [billy_detail_monocle, billy_detail_badge, billy_detail_wing, billy_detail_beak]]
